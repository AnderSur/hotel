<!-- ==================== tipoquarto/lista.html ==================== -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head><title>Tipos de Quarto &mdash; HotelSys</title></head>
<body>
<section th:fragment="content">

  <div class="page-header">
    <div class="page-title">Tipos de Quarto <small>Categorias e preços</small></div>
    <a th:href="@{/tipos-quarto/novo}" class="btn-accent-hotel">
      <i class="bi bi-plus-circle"></i> Novo Tipo
    </a>
  </div>

  <div class="card">
    <div class="card-body-pad p-0">
      <table class="table-hotel">
        <thead>
          <tr><th>#</th><th>Nome</th><th>Descrição</th><th>Preço / Dia</th><th>Ações</th></tr>
        </thead>
        <tbody>
          <tr th:each="t : ${tipos}">
            <td th:text="${t.id}"></td>
            <td><strong th:text="${t.nome}"></strong></td>
            <td th:text="${t.descricao}"></td>
            <td>
              <strong style="color:var(--primary);"
                th:text="'R$ ' + ${#numbers.formatDecimal(t.precoPorDia,1,'COMMA',2,'POINT')}"></strong>
            </td>
            <td>
              <a th:href="@{/tipos-quarto/editar/{id}(id=${t.id})}" class="btn-outline-hotel btn-sm-hotel">
                <i class="bi bi-pencil"></i>
              </a>
              <a th:href="@{/tipos-quarto/deletar/{id}(id=${t.id})}"
                 class="btn-danger-hotel btn-sm-hotel"
                 onclick="return confirm('Confirma exclusão?')">
                <i class="bi bi-trash"></i>
              </a>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(tipos)}">
            <td colspan="5" style="text-align:center;color:var(--text-muted);padding:2rem;">
              Nenhum tipo cadastrado.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</section>
</body>
</html>
