<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head><title>Nova Reserva &mdash; HotelSys</title></head>
<body>
<section th:fragment="content">

  <div class="page-header">
    <div class="page-title">Nova Reserva <small>Preencha os dados da reserva</small></div>
    <a th:href="@{/reservas}" class="btn-outline-hotel"><i class="bi bi-arrow-left"></i> Voltar</a>
  </div>

  <div th:if="${erro}" class="alert-hotel alert-danger">
    <i class="bi bi-exclamation-circle"></i> <span th:text="${erro}"></span>
  </div>

  <div class="card">
    <div class="card-header-custom"><i class="bi bi-calendar3"></i> Dados da Reserva</div>
    <div class="card-body-pad">
      <form th:action="@{/reservas/salvar}" th:object="${reserva}" method="post" class="form-hotel">
        <input type="hidden" th:field="*{id}"/>

        <div class="form-group">
          <label class="form-label">Cliente *</label>
          <select th:field="*{cliente.id}" class="form-control-hotel"
                  th:classappend="${#fields.hasErrors('cliente')} ? 'is-invalid'">
            <option value="">— Selecione o cliente —</option>
            <option th:each="c : ${clientes}" th:value="${c.id}"
                    th:text="${c.nome + ' — ' + c.cpf}"></option>
          </select>
          <div class="invalid-feedback" th:if="${#fields.hasErrors('cliente')}" th:errors="*{cliente}"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Quarto *</label>
          <select th:field="*{quarto.id}" class="form-control-hotel"
                  th:classappend="${#fields.hasErrors('quarto')} ? 'is-invalid'">
            <option value="">— Selecione o quarto —</option>
            <option th:each="q : ${quartos}" th:value="${q.id}"
                    th:text="'Quarto ' + ${q.numero} + ' — ' + ${q.tipoQuarto.nome} + ' — R$ ' + ${#numbers.formatDecimal(q.tipoQuarto.precoPorDia,1,'COMMA',2,'POINT')} + '/dia'"></option>
          </select>
          <div class="invalid-feedback" th:if="${#fields.hasErrors('quarto')}" th:errors="*{quarto}"></div>
        </div>

        <div class="row g-3">
          <div class="col-md-6">
            <div class="form-group">
              <label class="form-label">Data de Check-in *</label>
              <input type="date" th:field="*{dataCheckin}" class="form-control-hotel"
                     th:classappend="${#fields.hasErrors('dataCheckin')} ? 'is-invalid'"/>
              <div class="invalid-feedback" th:if="${#fields.hasErrors('dataCheckin')}" th:errors="*{dataCheckin}"></div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label class="form-label">Data de Check-out *</label>
              <input type="date" th:field="*{dataCheckout}" class="form-control-hotel"
                     th:classappend="${#fields.hasErrors('dataCheckout')} ? 'is-invalid'"/>
              <div class="invalid-feedback" th:if="${#fields.hasErrors('dataCheckout')}" th:errors="*{dataCheckout}"></div>
            </div>
          </div>
        </div>

        <div class="alert-hotel alert-info" style="margin-top:.5rem;">
          <i class="bi bi-info-circle"></i>
          A quantidade de dias e o total serão calculados automaticamente.
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-accent-hotel"><i class="bi bi-check-lg"></i> Confirmar Reserva</button>
          <a th:href="@{/reservas}" class="btn-outline-hotel">Cancelar</a>
        </div>
      </form>
    </div>
  </div>

</section>
</body>
</html>
