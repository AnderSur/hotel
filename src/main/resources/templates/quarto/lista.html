<!-- ==================== quarto/lista.html ==================== -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head><title>Quartos &mdash; HotelSys</title></head>
<body>
<section th:fragment="content">

  <div class="page-header">
    <div class="page-title">Quartos <small>Gerenciamento de acomodações</small></div>
    <div class="d-flex gap-2">
      <a th:href="@{/quartos/disponiveis}" class="btn-outline-hotel">
        <i class="bi bi-calendar-check"></i> Disponibilidade
      </a>
      <a th:href="@{/quartos/novo}" class="btn-accent-hotel">
        <i class="bi bi-plus-circle"></i> Novo Quarto
      </a>
    </div>
  </div>

  <div class="card">
    <div class="card-body-pad p-0">
      <table class="table-hotel">
        <thead>
          <tr><th>Nº</th><th>Andar</th><th>Tipo</th><th>Preço/Dia</th><th>Descrição</th><th>Status</th><th>Ações</th></tr>
        </thead>
        <tbody>
          <tr th:each="q : ${quartos}">
            <td><strong th:text="${q.numero}"></strong></td>
            <td th:text="${q.andar} + 'º'"></td>
            <td th:text="${q.tipoQuarto.nome}"></td>
            <td th:text="'R$ ' + ${#numbers.formatDecimal(q.tipoQuarto.precoPorDia,1,'COMMA',2,'POINT')}"></td>
            <td th:text="${q.descricao}"></td>
            <td>
              <span th:if="${q.disponivel}"  class="badge-hotel badge-disponivel">Disponível</span>
              <span th:if="${!q.disponivel}" class="badge-hotel badge-ocupado">Ocupado</span>
            </td>
            <td>
              <a th:href="@{/quartos/editar/{id}(id=${q.id})}" class="btn-outline-hotel btn-sm-hotel">
                <i class="bi bi-pencil"></i>
              </a>
              <a th:href="@{/quartos/deletar/{id}(id=${q.id})}"
                 class="btn-danger-hotel btn-sm-hotel"
                 onclick="return confirm('Confirma exclusão?')">
                <i class="bi bi-trash"></i>
              </a>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(quartos)}">
            <td colspan="7" style="text-align:center;color:var(--text-muted);padding:2rem;">
              Nenhum quarto cadastrado.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</section>
</body>
</html>
