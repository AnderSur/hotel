<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head><title>Serviço &mdash; HotelSys</title></head>
<body>
<section th:fragment="content">

  <div class="page-header">
    <div class="page-title">
      <span th:text="${servico.id == null} ? 'Novo Serviço' : 'Editar Serviço'"></span>
    </div>
    <a th:href="@{/servicos}" class="btn-outline-hotel"><i class="bi bi-arrow-left"></i> Voltar</a>
  </div>

  <div class="card">
    <div class="card-header-custom"><i class="bi bi-bell"></i> Dados do Serviço</div>
    <div class="card-body-pad">
      <form th:action="@{/servicos/salvar}" th:object="${servico}" method="post" class="form-hotel">
        <input type="hidden" th:field="*{id}"/>

        <div class="row g-3">
          <div class="col-md-5">
            <div class="form-group">
              <label class="form-label">Identificador Interno *</label>
              <input type="text" th:field="*{identificadorInterno}" class="form-control-hotel"
                     th:classappend="${#fields.hasErrors('identificadorInterno')} ? 'is-invalid'"
                     placeholder="Ex: SPA001, ALIM002"/>
              <div class="invalid-feedback" th:if="${#fields.hasErrors('identificadorInterno')}" th:errors="*{identificadorInterno}"></div>
            </div>
          </div>
          <div class="col-md-7">
            <div class="form-group">
              <label class="form-label">Nome *</label>
              <input type="text" th:field="*{nome}" class="form-control-hotel"
                     th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'"
                     placeholder="Ex: Spa, Café da manhã, Lavagem de roupas"/>
              <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Descrição</label>
          <textarea th:field="*{descricao}" class="form-control-hotel" rows="3"
                    placeholder="Descreva o serviço oferecido..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Valor (R$) *</label>
          <input type="number" step="0.01" min="0" th:field="*{valor}"
                 class="form-control-hotel"
                 th:classappend="${#fields.hasErrors('valor')} ? 'is-invalid'"
                 placeholder="0,00"/>
          <div class="invalid-feedback" th:if="${#fields.hasErrors('valor')}" th:errors="*{valor}"></div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-accent-hotel"><i class="bi bi-check-lg"></i> Salvar</button>
          <a th:href="@{/servicos}" class="btn-outline-hotel">Cancelar</a>
        </div>
      </form>
    </div>
  </div>

</section>
</body>
</html>
